# Pipeline evaluation on AerialFuseCV.
# Identical to p2_pipeline_aerialfusecv_v1 except for the dataset, so the mask
# definition is the only variable.
experiment: argusvision__yolo11x_obb__sam_vit_b__full
kind: pipeline
dataset:
  type: aerialfusecv
  path: dataset/AerialFuseCV/val
detector:
  name: yolo11x-obb
  conf_threshold: 0.25
segmenter:
  name: sam-vit-b
iou_thresholds: [0.1, 0.3, 0.5]
iou_mode: auto
seg_match_threshold: 0.1
