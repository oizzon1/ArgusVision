# Restructure Phase 4 validation: integrated pipeline, NEW canonical mode.
# Same run as validation_pipeline_aabb but with exact polygon IoU for OBBs —
# quantifies what the legacy AABB collapse was worth. This mode is the
# default for all P2 numbers.
experiment: restructure_validation_pipeline_polygon
kind: pipeline
dataset:
  type: aerialfusecv
  path: dataset/AerialFuseCV_Refined/val
detector:
  name: yolo11x-obb
  conf_threshold: 0.25
segmenter:
  name: sam-vit-b
iou_thresholds: [0.1, 0.3, 0.5]
iou_mode: auto
seg_match_threshold: 0.1
